# ============================================================
# Configuração central do gateway FreeBSD (fonte única de verdade).
# Edite SOMENTE este arquivo antes de rodar scripts/setup.sh.
# Descubra os nomes das interfaces com: ifconfig -l   (adaptadores USB: ue0, ue1...)
# ============================================================

# --- Interfaces ---
WAN_IF="ue0"           # lado da rede de acesso do laboratório (192.168.X.0/24)
LAN_IF="ue1"           # lado da LAN que estamos criando

# --- WAN: dhcp | static | keep (keep = não mexe na configuração atual) ---
WAN_MODE="dhcp"
WAN_IP="192.168.X.50"  # usado só se WAN_MODE=static
WAN_MASK="255.255.255.0"
WAN_GW="192.168.X.1"

# --- LAN (faixa privada RFC 1918, sub-rede /16) ---
LAN_NET="10.10.0.0/16"
LAN_NET_ADDR="10.10.0.0"
LAN_MASK="255.255.0.0"
LAN_PREFIX="16"
LAN_GW_IP="10.10.0.1"

# --- DHCP ---
DHCP_RANGE_START="10.10.1.1"
DHCP_RANGE_END="10.10.1.254"
DNS_SERVER="164.41.101.4"      # alternativas: 192.168.X.1 ou 164.41.101.11
STATIC_HOST_NAME="maquina-teste"
STATIC_HOST_MAC="aa:bb:cc:dd:ee:ff"   # MAC da máquina de teste da LAN
STATIC_HOST_IP="10.10.0.100"          # IP que ela sempre receberá

# --- DNAT: WAN:DNAT_WAN_PORT -> DNAT_TARGET_IP:DNAT_TARGET_PORT ---
DNAT_WAN_PORT="80"
DNAT_TARGET_IP="10.10.0.100"
DNAT_TARGET_PORT="8080"
